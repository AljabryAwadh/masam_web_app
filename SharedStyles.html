<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { 
    font-family: 'Inter', sans-serif; 
    background-color: #f3f4f6; 
    color: #1f2937; 
  }
  .nav-link { 
    font-weight: 500; 
    transition: color 0.15s ease-in-out; 
  }
  .section-header { 
    background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 100%); 
    color: white; 
    padding: 14px 20px; 
    border-radius: 8px 8px 0 0; 
    font-weight: 600; 
    margin-top: 25px; 
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); 
  }
  .form-container { 
    background: white; 
    border-radius: 16px; 
    box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1); 
    padding: 40px; 
    margin-bottom: 60px; 
  }
  .btn-primary { 
    background: #1d4ed8; 
    border: none; 
    padding: 12px; 
    font-weight: 600; 
    transition: all .2s; 
  }
  .btn-primary:hover { 
    background: #1e40af; 
    transform: translateY(-1px); 
  }
  #loader { 
    display: none; 
    position: fixed; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%; 
    background: rgba(15,23,42,0.85); 
    z-index: 9999; 
    justify-content: center; 
    align-items: center; 
    flex-direction: column; 
    backdrop-filter: blur(4px); 
  }
  .form-label { 
    font-size: .875rem; 
    margin-bottom: .4rem; 
    color: #4b5563; 
  }
  .custom-modal { 
    display: none; 
    position: fixed; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%; 
    background: rgba(0,0,0,0.5); 
    z-index: 10000; 
    justify-content: center; 
    align-items: center; 
    backdrop-filter: blur(3px); 
  }
  .modal-card { 
    background: white; 
    padding: 30px; 
    border-radius: 12px; 
    max-width: 500px; 
    width: 90%; 
    box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); 
    text-align: center; 
    animation: slideUp .3s ease-out; 
  }
  @keyframes slideUp { 
    from { transform: translateY(20px); opacity: 0 } 
    to { transform: translateY(0); opacity: 1 } 
  }
  .coord-hint { 
    font-size: .75rem; 
    color: #6b7280; 
    margin-top: 2px; 
  }
  .img-preview { 
    max-width: 100%; 
    height: 120px; 
    object-fit: cover; 
    border-radius: 6px; 
    border: 1px dashed #cbd5e1; 
  }
  .page-header { 
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); 
    color: white; 
    padding: 30px; 
    border-radius: 12px; 
    margin-bottom: 25px; 
  }
  .portal-header { 
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); 
    color: white; 
    padding: 40px 20px; 
    text-align: center; 
    border-radius: 12px; 
    margin-bottom: 30px; 
  }
</style>
