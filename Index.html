<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EOD Web Portal - Dashboard</title>
    <!-- Load Bootstrap 5 for consistent Portal Styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .nav-link { font-weight: 500; transition: color 0.15s ease-in-out; }
        .portal-header { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); color: white; padding: 40px 20px; text-align: center; border-radius: 0 0 16px 16px; margin-bottom: 30px; }
    </style>
</head>
<body>

<!-- Navigation Bar with explicit target="_top" parameters -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3 mb-4 shadow-sm">
  <div class="container-fluid">
    <span class="navbar-brand fw-bold text-primary">EOD Web Portal</span>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <div class="navbar-nav gap-2 ms-auto">
        <a class="nav-link" id="linkDashboard" href="#" target="_top">Dashboard</a>
        <a class="nav-link" id="linkDws" href="#" target="_top">Daily Worksheet</a>
        <a class="nav-link" id="linkOhc" href="#" target="_top">OHC</a>
        <a class="nav-link" id="linkTjetReg" href="#" target="_top">TJET Registry</a>
        <a class="nav-link" id="linkTjetReceipts" href="#" target="_top">TJET Receipts & Exp</a>
      </div>
    </div>
  </div>
</nav>

<div class="container">
    <div class="portal-header shadow-sm">
        <h1 class="fw-bold">Welcome to the EOD Operations Hub</h1>
        <p class="text-white-50">Select an option from the navigation menu above to access worksheets and registries.</p>
    </div>
</div>

<script>
  // Safe execution guard to check if running inside Google Apps Script environment.
  // This prevents 'ReferenceError: google is not defined' when testing locally or outside of the GAS iframe sandbox.
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run.withSuccessHandler(function(scriptUrl) {
      if (scriptUrl) {
        document.getElementById("linkDashboard").href = scriptUrl + "?page=Index";
        document.getElementById("linkDws").href = scriptUrl + "?page=DWS";
        document.getElementById("linkOhc").href = scriptUrl + "?page=OHC";
        document.getElementById("linkTjetReg").href = scriptUrl + "?page=TJET_Registry";
        document.getElementById("linkTjetReceipts").href = scriptUrl + "?page=TJET_Receipt_and_Expenditure";
      }
    }).getScriptUrl();
  } else {
    console.warn("Google Apps Script API (google.script.run) is not available in this environment. Falling back to local route queries.");
    // Fallback URL generation for local testing/preview environments
    const base = window.location.origin + window.location.pathname;
    document.getElementById("linkDashboard").href = base + "?page=Index";
    document.getElementById("linkDws").href = base + "?page=DWS";
    document.getElementById("linkOhc").href = base + "?page=OHC";
    document.getElementById("linkTjetReg").href = base + "?page=TJET_Registry";
    document.getElementById("linkTjetReceipts").href = base + "?page=TJET_Receipt_and_Expenditure";
  }
</script>

<!-- Bootstrap JS (Optional but recommended for mobile navbar toggle) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
